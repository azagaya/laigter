
name: Windows
on: [push, workflow_dispatch]

jobs:
  buildWin:
    runs-on: windows-latest
    steps:

    - name: checkout sources
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        # Not 6.11 yet: qt split the windows repo per toolchain starting with
        # it (qt6_6111_mingw instead of qt6_6111) and aqtinstall 3.3.0 still
        # looks for the old path, so installing it fails
        version: '6.10.2'
        arch: 'win64_mingw'
        target: 'desktop'
        host: 'windows'
        modules: 'qtimageformats'
        tools: 'tools_mingw1310'

    - name: Build Laigter
      shell: cmd
      env:
        # On a tag, the app reports the tag instead of the fallback in the pro
        QMAKE_VERSION_ARG: ${{ startsWith(github.ref, 'refs/tags/') && format('VERSION={0}', github.ref_name) || '' }}
      run: |
        qmake %QMAKE_VERSION_ARG%
        make

    - name: Package Laigter
      shell: cmd
      env:
        # laigter-setup-1.14.0.exe on a tag, plain laigter-setup.exe otherwise
        SETUP_NAME: ${{ startsWith(github.ref, 'refs/tags/') && format('laigter-setup-{0}.exe', github.ref_name) || 'laigter-setup.exe' }}
      run: |
        powershell -ExecutionPolicy Bypass -File dist\make-installer.ps1 -Exe release\laigter.exe -OutFile %SETUP_NAME%
        tar.exe -a -c -f laigter-windows.zip laigter-windows
        dir

    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: win-artifacts
        path: |
          laigter-windows.zip
          laigter-setup*.exe

    - name: GitHub Releases
      uses: svenstaro/upload-release-action@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: laigter-windows.zip
        tag: ${{ github.ref }}

    - name: GitHub Releases installer
      uses: svenstaro/upload-release-action@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: laigter-setup*.exe
        file_glob: true
        tag: ${{ github.ref }}
