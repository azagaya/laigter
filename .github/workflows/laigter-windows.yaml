
name: Windows
on: [push, workflow_dispatch]

jobs:
  buildWin:
    runs-on: windows-latest
    steps:

    - name: checkout sources
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        # Not 6.11 yet: qt split the windows repo per toolchain starting with
        # it (qt6_6111_mingw instead of qt6_6111) and aqtinstall 3.3.0 still
        # looks for the old path, so installing it fails
        version: '6.10.2'
        arch: 'win64_mingw'
        target: 'desktop'
        host: 'windows'
        modules: 'qtimageformats'
        tools: 'tools_mingw1310'

    - name: Build Laigter
      shell: cmd
      env:
        # On a tag, the app reports the tag instead of the fallback in the pro
        QMAKE_VERSION_ARG: ${{ startsWith(github.ref, 'refs/tags/') && format('VERSION={0}', github.ref_name) || '' }}
      run: |
        qmake %QMAKE_VERSION_ARG%
        make

    - name: Package Laigter
      shell: cmd
      env:
        # laigter-setup-1.14.0.exe on a tag, plain laigter-setup.exe otherwise
        SETUP_NAME: ${{ startsWith(github.ref, 'refs/tags/') && format('laigter-setup-{0}.exe', github.ref_name) || 'laigter-setup.exe' }}
      run: |
        powershell -ExecutionPolicy Bypass -File dist\make-installer.ps1 -Exe release\laigter.exe -OutFile %SETUP_NAME%
        dir

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: win-artifacts
        path: |
          laigter-windows
          laigter-setup*.exe

    - name: Install Butler
      if: startsWith(github.ref, 'refs/tags/')
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Path .butler | Out-Null
        Invoke-WebRequest -UseBasicParsing `
          -Uri 'https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default' `
          -OutFile butler.zip
        Expand-Archive -LiteralPath butler.zip -DestinationPath .butler -Force
        .\.butler\butler.exe -V

    - name: Publish Windows build to itch.io
      if: startsWith(github.ref, 'refs/tags/')
      shell: powershell
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      run: |
        .\.butler\butler.exe push laigter-windows azagaya/laigter:windows --userversion $env:GITHUB_REF_NAME
