name: Ubuntu Latest
on: push

jobs:
  buildOnUbuntu:
    runs-on: ubuntu-24.04

    steps:
    - name: checkout sources
      uses: actions/checkout@v4

    - name: Install Dependencies
      shell: bash
      run: |
        apt-get update && apt-get install -y sudo p7zip-full wget file libwayland-cursor0 libwayland-egl1
        sudo ln -fs /usr/share/zoneinfo/UTC /etc/localtime
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends software-properties-common
        
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        aqtversion: '==3.1.*'
        version: '6.11.0'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtimageformats qtwaylandcompositor'

    - name: Build Laigter
      shell: bash
      run: |
        echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        qmake CONFIG+=release PREFIX=/usr
        make -j$(nproc)
        make INSTALL_ROOT=appdir install
        
    - name: Create Appimage
      run: |
        set -eu
        curl -Lo quick-sharun https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/quick-sharun.sh
        chmod +x quick-sharun
        export OUTPATH=.
        export ADD_HOOKS="self-updater.bg.hook"
        export ICON=https://raw.githubusercontent.com/azagaya/laigter/refs/heads/master/dist/laigter.png
        export DESKTOP=https://raw.githubusercontent.com/azagaya/laigter/refs/heads/master/dist/laigter.desktop
        export DEPLOY_OPENGL=1
        ./quick-sharun /usr/bin/laigter
        ./quick-sharun --make-appimage

    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-artifact
        path: Laigter-x86_64.AppImage 

    - name: GitHub Releases
      uses: fnkr/github-action-ghr@v1.3
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GHR_PATH: Laigter-x86_64.AppImage
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

