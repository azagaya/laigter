name: Ubuntu Latest
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
    - name: checkout sources
      uses: actions/checkout@v5

    - name: Preparing Container
      uses: pkgforge-dev/anylinux-setup-action@v1
        
    - name: Install dependencies & Qt6 on Arch
      run: |
        set -eu
        pacman -Syu --noconfirm
        # patchelf is what quick-sharun uses to rewrite the rpaths, and the
        # qt6ct, kvantum and lxqt plugins are what it bundles so the app can
        # follow the theme of whatever desktop it ends up running on
        pacman -S --needed --noconfirm base-devel git make patchelf unzip qt6-base qt6-tools qt6-imageformats qt6ct kvantum lxqt-qtplugin
        get-debloated-pkgs mesa-nano libxml2-mini opus-mini
        ls /usr/bin/qmake*
        # Arch is rolling, so write down which Qt this AppImage was built with
        pacman -Q qt6-base qt6-tools qt6-imageformats

    - name: Build Laigter
      shell: bash
      env:
        # On a tag, the app reports the tag instead of the fallback in the pro
        QMAKE_VERSION_ARG: ${{ startsWith(github.ref, 'refs/tags/') && format('VERSION={0}', github.ref_name) || '' }}
      run: |
        echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        /usr/bin/qmake6 CONFIG+=release PREFIX=/usr $QMAKE_VERSION_ARG
        make -j$(nproc)
        make INSTALL_ROOT=appdir install
        
    - name: Create Appimage
      run: |
        set -eu
        curl -Lo quick-sharun https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/quick-sharun.sh
        chmod +x quick-sharun
        export ARCH="$(uname -m)"
        export OUTNAME="Laigter-${ARCH}.AppImage"
        export OUTPATH=./binaries
        export ICON=dist/laigter.png
        export DESKTOP=dist/laigter.desktop
        export DEPLOY_OPENGL=1
        ./quick-sharun appdir/usr/bin/laigter
        ./quick-sharun --make-appimage

    - name: Install Butler
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -eu
        mkdir .butler
        curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
        unzip -q butler.zip -d .butler
        chmod +x .butler/butler
        .butler/butler -V

    - name: Publish Linux build to itch.io
      if: startsWith(github.ref, 'refs/tags/')
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      run: |
        .butler/butler push binaries azagaya/laigter:linux --userversion "$GITHUB_REF_NAME"
