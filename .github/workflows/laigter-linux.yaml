name: Ubuntu Latest
on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
    - name: checkout sources
      uses: actions/checkout@v5

    - name: Preparing Container
      uses: pkgforge-dev/anylinux-setup-action@v1
        
    - name: Install dependencies & Qt6 on Arch
      run: |
        set -eu
        pacman -Syu --noconfirm
        pacman -S --needed --noconfirm base-devel git make qt6-base qt6-tools qt6-imageformats
        get-debloated-pkgs mesa-nano libxml2-mini opus-mini
        ls /usr/bin/qmake*

    - name: Build Laigter
      shell: bash
      env:
        # On a tag, the app reports the tag instead of the fallback in the pro
        QMAKE_VERSION_ARG: ${{ startsWith(github.ref, 'refs/tags/') && format('VERSION={0}', github.ref_name) || '' }}
      run: |
        echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        /usr/bin/qmake6 CONFIG+=release PREFIX=/usr $QMAKE_VERSION_ARG
        make -j$(nproc)
        make INSTALL_ROOT=appdir install
        
    - name: Create Appimage
      run: |
        set -eu
        curl -Lo quick-sharun https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/quick-sharun.sh
        chmod +x quick-sharun
        export ARCH="$(uname -m)"
        export OUTNAME="Laigter-${ARCH}.AppImage"
        export OUTPATH=./binaries
        export ADD_HOOKS="self-updater.bg.hook"
        export UPINFO="gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|*$ARCH.AppImage.zsync"
        export ICON=dist/laigter.png
        export DESKTOP=dist/laigter.desktop
        export DEPLOY_OPENGL=1
        ./quick-sharun appdir/usr/bin/laigter
        ./quick-sharun --make-appimage

    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AppImage-x86_64
        path: binaries

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@v1
