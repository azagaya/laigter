name: MacOS
on: [push, workflow_dispatch]
      
jobs:
  buildMac:
    runs-on: macOS-latest
    steps:
    - name: checkout sources
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        arch: 'clang_64'
        modules: 'qtimageformats'
     
    - name: build Laigter
      shell: bash
      env:
        # On a tag, the app reports the tag instead of the fallback in the pro
        QMAKE_VERSION_ARG: ${{ startsWith(github.ref, 'refs/tags/') && format('VERSION={0}', github.ref_name) || '' }}
      run: |
        qmake CONFIG+=release PREFIX=/usr $QMAKE_VERSION_ARG
        make -j$(nproc)
        make INSTALL_ROOT=appdir install
        find appdir/
        mkdir -p appdir/usr/lib
        macdeployqt laigter.app
        mkdir -p laigter-mac
        ditto laigter.app laigter-mac/laigter.app

    - name: Install Butler
      if: github.ref == 'refs/tags/1.15.0'
      shell: bash
      run: |
        set -eu
        case "$(uname -m)" in
          arm64) BUTLER_PLATFORM=darwin-arm64 ;;
          x86_64) BUTLER_PLATFORM=darwin-amd64 ;;
          *) echo "Unsupported macOS architecture: $(uname -m)"; exit 1 ;;
        esac
        mkdir .butler
        curl -L -o butler.zip "https://broth.itch.zone/butler/${BUTLER_PLATFORM}/LATEST/archive/default"
        ditto -x -k butler.zip .butler
        chmod +x .butler/butler
        .butler/butler -V

    - name: Publish hidden macOS build to itch.io
      if: github.ref == 'refs/tags/1.15.0'
      shell: bash
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      run: |
        .butler/butler push --hidden laigter-mac azagaya/laigter:mac --userversion 1.15.0
